name: Build and deploy to k3s

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: travelbuddy-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set image name
        id: image
        run: echo "name=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ steps.image.outputs.name }}:${{ github.sha }}
            ${{ steps.image.outputs.name }}:latest

      - uses: azure/setup-kubectl@v4

      - name: Configure cluster access
        env:
          KUBE_CONFIG_B64: ${{ secrets.KUBE_CONFIG_B64 }}
        run: |
          mkdir -p "$HOME/.kube"
          printf '%s' "$KUBE_CONFIG_B64" | base64 -d > "$HOME/.kube/config"
          chmod 600 "$HOME/.kube/config"

      - name: Install envsubst
        run: sudo apt-get update && sudo apt-get install -y gettext-base

      - name: Apply namespace, Service, and Ingress
        run: kubectl apply -f k8s/base.yaml

      - name: Apply PostgreSQL StatefulSet
        run: |
          kubectl apply -f k8s/postgres.yaml
          kubectl rollout status statefulset/postgres --namespace travelbuddy --timeout=10m

      - name: Run database migrations
        run: |
          kubectl delete job travelbuddy-migrate --namespace travelbuddy --ignore-not-found
          kubectl apply -f k8s/migration-job.yaml
          kubectl wait --for=condition=complete job/travelbuddy-migrate \
            --namespace travelbuddy --timeout=10m

      - name: Deploy app
        run: |
          kubectl apply -f k8s/app.yaml
          kubectl rollout restart deployment/travelbuddy --namespace travelbuddy
          kubectl rollout status deployment/travelbuddy \
            --namespace travelbuddy --timeout=5m
