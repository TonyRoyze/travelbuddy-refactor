name: Build and publish container

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    env:
      PUBLIC_SITE_URL: https://travelbuddy.example.invalid
      VITE_SUPABASE_URL: https://supabase.example.invalid
      VITE_SUPABASE_PUBLISHABLE_KEY: ci-public-placeholder
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.19.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Type check
        run: pnpm typecheck
      - name: Lint
        run: pnpm lint
      - name: Unit tests
        run: pnpm test
      - name: Production build
        run: pnpm build

  publish:
    needs: checks
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: Check required repository variables
        env:
          SUPABASE_PUBLISHABLE_KEY: ${{ vars.SUPABASE_PUBLISHABLE_KEY }}
          PUBLIC_SITE_URL: ${{ vars.PUBLIC_SITE_URL }}
        run: |
          test -n "$SUPABASE_PUBLISHABLE_KEY" || { echo "Set repository variable SUPABASE_PUBLISHABLE_KEY."; exit 1; }
          test -n "$PUBLIC_SITE_URL" || { echo "Set repository variable PUBLIC_SITE_URL to the app's final HTTPS origin."; exit 1; }

      - name: Set image name
        id: image
        run: echo "name=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.image.outputs.name }}:${{ github.sha }}
          build-args: |
            VITE_SUPABASE_URL=https://supabase.shalinda.com
            VITE_SUPABASE_PUBLISHABLE_KEY=${{ vars.SUPABASE_PUBLISHABLE_KEY }}
            PUBLIC_SITE_URL=${{ vars.PUBLIC_SITE_URL }}
