apiVersion: v1
kind: Namespace
metadata:
  name: travelbuddy
---
apiVersion: v1
kind: Service
metadata:
  name: travelbuddy
  namespace: travelbuddy
spec:
  selector:
    app: travelbuddy
  ports:
    - name: http
      port: 80
      targetPort: 3000
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: travelbuddy
  namespace: travelbuddy
spec:
  ingressClassName: traefik
  tls:
    - hosts:
        - travelbuddy.shalinda.com
      secretName: travelbuddy-tls
  rules:
    - host: travelbuddy.shalinda.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: travelbuddy
                port:
                  number: 80
