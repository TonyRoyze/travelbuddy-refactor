apiVersion: apps/v1
kind: Deployment
metadata:
  name: travelbuddy
  namespace: travelbuddy
spec:
  replicas: 2
  selector:
    matchLabels:
      app: travelbuddy
  template:
    metadata:
      labels:
        app: travelbuddy
    spec:
      imagePullSecrets:
        - name: ghcr-pull
      containers:
        - name: app
          image: ghcr.io/shalinda/travelbuddy:latest
          imagePullPolicy: Always
          ports:
            - name: http
              containerPort: 3000
          envFrom:
            - secretRef:
                name: travelbuddy-secrets
          startupProbe:
            httpGet:
              path: /
              port: http
            periodSeconds: 5
            failureThreshold: 30
          readinessProbe:
            httpGet:
              path: /
              port: http
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /
              port: http
            periodSeconds: 20
          resources:
            requests:
              cpu: 250m
              memory: 512Mi
            limits:
              cpu: "1"
              memory: 1Gi
