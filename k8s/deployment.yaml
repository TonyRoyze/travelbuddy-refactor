apiVersion: apps/v1
kind: Deployment
metadata:
  name: travelbuddy
  namespace: travelbuddy
  labels:
    app.kubernetes.io/name: travelbuddy
spec:
  replicas: 1
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 0
      maxUnavailable: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: travelbuddy
  template:
    metadata:
      labels:
        app.kubernetes.io/name: travelbuddy
    spec:
      terminationGracePeriodSeconds: 45
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      # If the GHCR package is private, create this pull Secret in this namespace.
      # imagePullSecrets:
      #   - name: ghcr-pull
      containers:
        - name: app
          image: ghcr.io/shalinda/travelbuddy:REPLACE_WITH_COMMIT_SHA
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8080
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
          volumeMounts:
            - name: tmp
              mountPath: /tmp
          env:
            - name: PORT
              value: "8080"
            - name: SUPABASE_URL
              value: http://supabase-envoy.supabase.svc.cluster.local:8000
            - name: SUPABASE_PUBLISHABLE_KEY
              valueFrom:
                secretKeyRef:
                  name: travelbuddy-runtime
                  key: SUPABASE_PUBLISHABLE_KEY
            - name: SUPABASE_SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: travelbuddy-runtime
                  key: SUPABASE_SECRET_KEY
            - name: SUPABASE_STORAGE_SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: travelbuddy-runtime
                  key: SUPABASE_STORAGE_SECRET_KEY
                  optional: true
            - name: APNS_TEAM_ID
              value: 3U4384584Z
            - name: APNS_ENVIRONMENT
              value: production
            - name: APNS_TOPIC
              value: com.travelbuddy.app
            - name: APNS_KEY_ID
              valueFrom:
                secretKeyRef:
                  name: travelbuddy-runtime
                  key: APNS_KEY_ID
                  optional: true
            - name: APNS_PRIVATE_KEY
              valueFrom:
                secretKeyRef:
                  name: travelbuddy-runtime
                  key: APNS_PRIVATE_KEY
                  optional: true
            - name: MEDIA_HOST
              value: 127.0.0.1
            - name: MEDIA_PORT
              value: "5174"
            - name: MEDIA_ALLOWED_ORIGINS
              value: https://REPLACE_WITH_APP_HOSTNAME
            - name: PAYMENTS_HOST
              value: 127.0.0.1
            - name: PAYMENTS_PORT
              value: "5175"
            - name: PAYMENTS_SITE_URL
              value: https://REPLACE_WITH_APP_HOSTNAME
            - name: PAYMENTS_CALLBACK_URL
              value: https://REPLACE_WITH_APP_HOSTNAME
            - name: PAYHERE_MODE
              value: sandbox
            - name: PAYHERE_MERCHANT_ID
              valueFrom:
                secretKeyRef:
                  name: travelbuddy-runtime
                  key: PAYHERE_MERCHANT_ID
                  optional: true
            - name: PAYHERE_MERCHANT_SECRET
              valueFrom:
                secretKeyRef:
                  name: travelbuddy-runtime
                  key: PAYHERE_MERCHANT_SECRET
                  optional: true
            - name: PAYHERE_APP_ID
              valueFrom:
                secretKeyRef:
                  name: travelbuddy-runtime
                  key: PAYHERE_APP_ID
                  optional: true
            - name: PAYHERE_APP_SECRET
              valueFrom:
                secretKeyRef:
                  name: travelbuddy-runtime
                  key: PAYHERE_APP_SECRET
                  optional: true
          readinessProbe:
            httpGet:
              path: /readyz
              port: http
            periodSeconds: 5
            timeoutSeconds: 2
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /livez
              port: http
            periodSeconds: 20
            timeoutSeconds: 2
            failureThreshold: 3
          startupProbe:
            httpGet:
              path: /livez
              port: http
            periodSeconds: 5
            timeoutSeconds: 2
            failureThreshold: 24
          resources:
            requests:
              cpu: 250m
              memory: 384Mi
              ephemeral-storage: 128Mi
            limits:
              cpu: "1"
              memory: 1Gi
              ephemeral-storage: 512Mi
      volumes:
        - name: tmp
          emptyDir:
            sizeLimit: 128Mi
